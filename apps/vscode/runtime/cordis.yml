# dsh VSCode extension runtime composition.
# stdout is reserved for JSON-RPC frames; do not add a console logger.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: true

- id: settings
  name: '@deepseek-ai/dsh-settings-file'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# Provider/model are selected per session over the JSON-RPC `initialize` call.
# The ApiPresetStore maps a preset to one of these route keys plus a model id.
# dsh-llm-deepseek provides the `deepseek-official` route the agent spine
# selects by default; pi-ai adds the catalog routes (deepseek/openai/anthropic).
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max

- id: llm
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
        baseURL: !!js process.env.OPENAI_BASE_URL
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: !!js process.env.DEEPSEEK_BASE_URL
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
        baseURL: !!js process.env.ANTHROPIC_BASE_URL

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: You are a coding agent running inside a VSCode sidebar chat. You can read and edit files, run shell commands, and delegate work to Claude Code and OpenCode subagents.
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: zstd

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-claude-code
  name: '@deepseek-ai/dsh-subagent-claude-code'
  config:
    providerName: claude-code
    permissionMode: dontAsk

- id: subagent-opencode
  name: '@deepseek-ai/dsh-subagent-acp'
  config:
    providerName: opencode
    command: opencode
    args: ['acp']
    permission: allow

- id: tool-subagent-claude-code
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: claude-code
    toolName: subagent_claude_code
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: provider-managed

- id: tool-subagent-opencode
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: opencode
    toolName: subagent_opencode
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: provider-managed

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
